; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; This project keeps globally-installed copies of AsyncTCP / ESPAsyncWebServer /
; Preferences / ESPUI in ~/Arduino/libraries that conflict with these. Pin every
; version here (below) so the LDF resolves the pinned copies.
;
; deep+ is required so ArduinoJson's include path is visible when
; ESPAsyncWebServer's own AsyncJson.cpp compiles (it guards its ArduinoJson
; support behind __has_include(<ArduinoJson.h>)); chain modes don't cross into
; a sibling library's headers.
lib_ldf_mode = deep+

build_flags =
    ; ElegantOTA must run against the async web server (see src/CLAUDE.md)
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; Put ArduinoJson on every translation unit's include path. ESPAsyncWebServer's
    ; own AsyncJson.cpp gates its ArduinoJson support behind
    ; __has_include(<ArduinoJson.h>), but PlatformIO compiles each library in
    ; isolation and doesn't add a sibling library's headers -- so without this the
    ; AsyncCallbackJsonWebHandler symbols web_server.cpp needs are never emitted.
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/ArduinoJson/src"

lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    contrem/arduino-timer @ 3.0.1
    rlogiacco/CircularBuffer @ 1.4.0
    paulstoffregen/Time @ ^1.6.1
    jchristensen/Timezone @ ^1.2.4
    arduino-libraries/NTPClient @ ^3.2.1
    milesburton/DallasTemperature @ ^4.0.3
    paulstoffregen/OneWire @ ^2.3.8
    ayushsharma82/ElegantOTA @ ^3.1.7
    esp32async/ESPAsyncWebServer @ 3.7.3

[env:esp12e]
platform = espressif8266
board = esp12e
; ESP8266 has no native Preferences; this shim provides it.
; AsyncTCP flavour for ESP8266 is ESPAsyncTCP, pulled in explicitly.
lib_deps =
    ${env.lib_deps}
    vshymanskyy/Preferences @ ^2.1.0
    esp32async/ESPAsyncTCP @ ^2.0.0

; Kept for reference — the ESP32 target the sketch also supports (src/CLAUDE.md).
; On ESP32, Preferences is built into the core and AsyncTCP replaces ESPAsyncTCP.
; esp32async/AsyncTCP 3.3.x needs an Arduino-ESP32 3.x core (NetworkInterface.h);
; platform 7.x ships it.
[env:esp32dev]
platform = espressif32 @ ^7.0.0
board = esp32dev
lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP @ ^3.3.2
